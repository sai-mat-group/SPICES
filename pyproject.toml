[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "spices"
version = "0.1.0"
description = "Seawater Pourbaix Intercalation Cation Electrode Screening (SPICES)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "Sougat"},
]

dependencies = [
    "pymatgen>=2023.0.0",
    "mp-api>=0.30.0",
    "pandas>=1.5.0",
    "numpy>=1.22.0",
    "matplotlib>=3.5.0",
    "shapely>=2.0.0",
    "openpyxl>=3.0.0",
    "python-dotenv>=1.0.0",
    "alphashape>=1.3.0",
    "networkx>=3.0",
    "matplotlib-venn>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
include = ["spices*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require Materials Project API access",
]
